<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AI Video Editor</title>
<style>
  html, body { height: 100%; margin: 0; background: #09090b; color: #e4e4e7; font: 14px system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
  .logo { font-weight: 600; font-size: 16px; } .logo span { color: #a78bfa; }
  .bar { width: 180px; height: 3px; background: #27272a; border-radius: 2px; overflow: hidden; }
  .bar div { width: 40%; height: 100%; background: #8b5cf6; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  #msg { color: #71717a; font-size: 12px; max-width: 420px; text-align: center; }
</style>
</head>
<body>
  <div class="logo"><span>◆</span> AI Video Editor</div>
  <div class="bar"><div></div></div>
  <div id="msg">Starting the editor…</div>
</body>
</html>
